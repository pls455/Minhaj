name: MINHAJ Flutter CI

on:
  push:
    branches:
      - rebuild/flutter-platform-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/minhaj_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android and Web platform scaffolding
        run: flutter create --project-name minhaj --org com.karam --platforms=android,web .

      - name: Install dependencies
        run: flutter pub get

      - name: Apply safe Dart quick fixes
        run: dart fix --apply

      - name: Persist generated platform scaffolding and safe fixes
        if: (github.event_name == 'push' && github.ref == 'refs/heads/rebuild/flutter-platform-foundation') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rebuild/flutter-platform-foundation')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android web lib test analysis_options.yaml pubspec.lock pubspec.yaml .metadata .gitignore
          if ! git diff --cached --quiet; then
            git commit -m "build: bootstrap Flutter platforms and apply safe analyzer fixes"
            git push origin "HEAD:rebuild/flutter-platform-foundation"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web preview
        run: flutter build web --release

      - name: Build Android preview APK
        run: flutter build apk --debug

      - name: Upload preview builds
        uses: actions/upload-artifact@v4
        with:
          name: minhaj-preview-builds
          path: |
            apps/minhaj_flutter/build/app/outputs/flutter-apk/app-debug.apk
            apps/minhaj_flutter/build/web
          if-no-files-found: error
          retention-days: 7

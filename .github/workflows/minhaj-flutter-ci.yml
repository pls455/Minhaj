name: MINHAJ Flutter CI

on:
  push:
    branches:
      - rebuild/flutter-platform-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/minhaj_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web preview
        run: flutter build web --release

      - name: Build Android preview APK
        run: flutter build apk --debug

      - name: Upload preview builds
        uses: actions/upload-artifact@v4
        with:
          name: minhaj-preview-builds
          path: |
            apps/minhaj_flutter/build/app/outputs/flutter-apk/app-debug.apk
            apps/minhaj_flutter/build/web
          if-no-files-found: error
          retention-days: 7

<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المديريات | مِنهَاج</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body><header id="site-header"></header><main class="container admin-page"><section class="page-head"><span class="eyebrow">لوحة الإدارة</span><h1>المديريات</h1><p class="muted">تعريف المديريات التي تُستخدم كبيانات تنظيمية للمدارس. لا توجد علاقة مباشرة بينها وبين حساب الطالب.</p><div class="actions"><button id="add-directorate" class="button primary" type="button">إضافة مديرية</button><a class="button" href="schools.html">إدارة المدارس</a><a class="button" href="index.html">لوحة التحكم</a></div></section><section class="card"><div class="toolbar"><input id="directorate-search" type="search" placeholder="ابحث باسم المديرية أو المحافظة أو المنطقة" aria-label="البحث في المديريات"></div><div id="directorate-list" class="admin-table" aria-live="polite"><div class="loading">جاري تحميل المديريات...</div></div></section></main><dialog id="directorate-modal"><form id="directorate-form" class="admin-editor"><div class="section-head"><h2 id="directorate-form-title">إضافة مديرية</h2><button id="close-directorate" class="button" type="button">إغلاق</button></div><input id="directorate-id" type="hidden"><label>اسم المديرية<input id="directorate-name" required maxlength="160"></label><label>كود المديرية<input id="directorate-code" maxlength="80" placeholder="مثال: NGS-01"></label><label>المحافظة<input id="directorate-governorate" required maxlength="120"></label><label>المنطقة<input id="directorate-area" required maxlength="120"></label><label>مدير المديرية<input id="directorate-manager" maxlength="160"></label><label>الهاتف<input id="directorate-phone" type="tel" maxlength="40"></label><label>البريد الإلكتروني<input id="directorate-email" type="email" maxlength="200"></label><label class="full">العنوان<input id="directorate-address" maxlength="300"></label><label class="full">ملاحظات<textarea id="directorate-notes" maxlength="2000"></textarea></label><label class="check"><input id="directorate-active" type="checkbox" checked> مديرية نشطة</label><p id="directorate-error" class="message" role="alert"></p><div class="actions"><button class="button" type="button" id="cancel-directorate">إلغاء</button><button class="button primary" type="submit">حفظ المديرية</button></div></form></dialog><footer id="site-footer"></footer><script type="module" src="../js/admin/directorates.js"></script></body></html>
